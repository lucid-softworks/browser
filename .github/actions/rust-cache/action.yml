name: Rust compiler cache
description: Persist Kache outputs across source changes and cache Windows executables.
inputs:
  prefix:
    description: Separate incompatible build variants.
    required: true
  max-size:
    description: Local store budget before eviction.
    default: 2GiB
runs:
  using: composite
  steps:
    - name: Wait for native runtime hashes
      shell: bash
      run: echo 'KACHE_NATIVE_RUNTIME_WARMUP=0' >> "$GITHUB_ENV"
    - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        version: '2.1.1'
        github-cache: false
        cache-dir: ${{ runner.temp }}/kache
        cache-executables: true
        max-size: ${{ inputs.max-size }}
        pr-comment: false
    - uses: actions/cache@v4
      with:
        path: ${{ env.KACHE_CACHE_DIR }}
        key: ${{ inputs.prefix }}-v2.1.1-exe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.prefix }}-v2.1.1-exe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-
          ${{ inputs.prefix }}-v2.1.1-exe-${{ runner.os }}-${{ runner.arch }}-
