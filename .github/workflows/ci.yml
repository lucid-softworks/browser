name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Release tags are validated by the cross-platform desktop workflow.
    tags: ['v*']

# A new push to a PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI restores compiler outputs through Kache instead of retaining incremental state.
  CARGO_INCREMENTAL: 0

jobs:
  # NOTE: the Conventional-Commit PR-title check lives in its own workflow (pr-title.yml) so it
  # re-runs when the title is EDITED — which this workflow's default pull_request trigger
  # (opened/synchronize/reopened) does not cover — without re-running the build/test matrix on
  # every title or description edit.

  # Fast lint pass (one OS): formatting + clippy. Fails the PR on warnings. PRs + main only — the
  # tags use the cross-platform desktop workflow, so skip lint here.
  lint:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Cache Rust compilations
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: '2.1.1'
          cache-key-prefix: kache-lint
          max-size: '2GiB'
          pr-comment: false
      - name: Install desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The Rust engine + all unit tests build and pass on Linux. Runs on PRs and main as a per-push
  # gate so test regressions surface before merge. Desktop builds also run on Windows and macOS
  # in desktop.yml; the optional Swift/AppKit shell has a separate release workflow.
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      # Share eligible release compiler outputs with the nightly WebDriver build.
      - name: Cache Rust compilations
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: '2.1.1'
          cache-key-prefix: kache-release
          max-size: '2GiB'
          pr-comment: false
      # Rune links Wayland/XKB; engine-only tests still exercise system-font discovery.
      - name: Install desktop libraries and test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers fonts-dejavu-core fonts-liberation
      - name: Build + test
        run: |
          cargo build --workspace --release
          cargo test --workspace --release
      - name: Test Lumen property-cache regressions
        run: |
          # Upstream's unit-test module includes these benchmark fixtures at compile time.
          # Pin the same source used by Lumen's scripts/run-v8bench.sh.
          mkdir -p v8-v7
          fixture_source="https://raw.githubusercontent.com/mozilla/arewefastyet/0e2160885d0ca693577d54f1bbbe572f052282c6/benchmarks/v8-v7"
          curl -fL --retry 3 "$fixture_source/base.js" -o v8-v7/base.js
          curl -fL --retry 3 "$fixture_source/richards.js" -o v8-v7/richards.js
          cargo test --locked -p lumen --lib stub_cache_
